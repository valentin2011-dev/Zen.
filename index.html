<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>ZEN</title>
<meta name="description" content="Application personnelle ZEN — notes, projets et motivation.">
<meta name="theme-color" content="#0a0a0d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZEN">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============================================================
     Ecran de lancement
     ============================================================ -->
<div id="splash">
  <div class="sparkles" id="sparkles"></div>
  <div class="splash-spinner"></div>
  <div class="splash-z">Z</div>
</div>

<div id="app">

  <!-- ============================================================
       MENU 1 — Accueil
       ============================================================ -->
  <section class="screen active" id="screen-home">
    <div class="hero-header">
      <div class="watch hero watch--chrono" id="watch-home"></div>
      <div class="greeting" id="home-hello">Bonjour Valentin !</div>
      <div class="quote" data-i18n="home_quote"></div>
    </div>

    <div class="circle-nav">
      <button class="circle-btn" data-action="go-notes" aria-label="Notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gold-bright)"><path d="M4 4h13l3 3v13H4z"/><path d="M15 4v5h5"/><path d="M8 12h8M8 16h5"/></svg>
      </button>
      <button class="circle-btn" data-action="go-projects" aria-label="Projets">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gold-bright)"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button class="circle-btn" data-action="go-motivation" aria-label="Motivation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gold-bright)"><path d="M12 3l2.6 5.9L21 9.6l-4.6 4.2L17.6 21 12 17.6 6.4 21l1.2-7.2L3 9.6l6.4-.7z"/></svg>
      </button>
    </div>
  </section>

  <!-- ============================================================
       MENU 2 — Note idée
       ============================================================ -->
  <section class="screen" id="screen-notes">
    <div class="mini-header">
      <div class="watch mini watch--black" id="watch-notes"></div>
      <div class="htext">
        <div class="hello" data-i18n="greeting_short"></div>
        <div class="label-row">
          <span class="label-text" id="notes-label-text">Note idée</span>
          <button class="edit-pencil" data-action="edit-label" data-menu="notes" aria-label="Modifier">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gold-bright)"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="digital-time" id="notes-time">--:--</div>

    <div class="pill-row">
      <button class="pill two tappable" data-action="open-important" data-i18n="important_ideas"></button>
      <button class="pill two tappable" data-action="open-all-notes" data-i18n="all_notes"></button>
    </div>

    <div class="eyebrow" data-i18n="recent_notes"></div>
    <div id="notes-recent-list"></div>
    <button class="add-btn big" data-action="add-note" aria-label="Nouvelle note">+</button>
  </section>

  <!-- ============================================================
       MENU 3 — Projets
       ============================================================ -->
  <section class="screen" id="screen-projects">
    <div class="mini-header">
      <div class="watch mini watch--skeleton" id="watch-projects"></div>
      <div class="htext">
        <div class="hello" data-i18n="greeting_short"></div>
        <div class="label-row">
          <span class="label-text" id="projects-label-text">Projet</span>
          <button class="edit-pencil" data-action="edit-label" data-menu="projects" aria-label="Modifier">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gold-bright)"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="digital-time" id="projects-time">--:--</div>

    <div class="eyebrow" data-i18n="your_folders"></div>
    <div id="projects-list"></div>
    <button class="add-btn big" data-action="add-project" aria-label="Nouveau projet">+</button>
  </section>

  <!-- ============================================================
       MENU 4 — Motivation
       ============================================================ -->
  <section class="screen" id="screen-motivation">
    <div class="mini-header">
      <div class="watch mini watch--chrono" id="watch-motivation"></div>
      <div class="htext">
        <div class="hello" data-i18n="greeting_short"></div>
        <div class="label-row">
          <span class="label-text" id="motivation-label-text">Motivation</span>
          <button class="edit-pencil" data-action="edit-label" data-menu="motivation" aria-label="Modifier">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gold-bright)"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="motivation-title">MILLIONAIRE</div>
    <div class="motivation-underline"></div>
    <div class="motivation-quote" data-i18n="home_quote"></div>

    <button class="add-btn big" data-action="add-quote" aria-label="Nouvelle citation">+</button>
    <div class="eyebrow" data-i18n="your_quotes"></div>
    <div id="quotes-list"></div>
  </section>

  <!-- ============================================================
       MODE ZEN
       ============================================================ -->
  <section class="screen" id="screen-zen">
    <div class="watch hero watch--navy" id="watch-zen"></div>
    <div class="zen-time" id="zen-time">--:--</div>
  </section>

  <!-- ============================================================
       REGLAGES
       ============================================================ -->
  <section class="screen" id="screen-settings">
    <div class="eyebrow" data-i18n="appearance"></div>
    <div class="card settings-card">
      <div class="settings-row">
        <span class="s-label" data-i18n="theme"></span>
        <div class="theme-swatches">
          <div class="swatch dark" data-action="set-theme" data-theme="dark" aria-label="Sombre"></div>
          <div class="swatch light" data-action="set-theme" data-theme="light" aria-label="Clair"></div>
        </div>
      </div>
      <div class="settings-row">
        <span class="s-label" data-i18n="language"></span>
        <div class="lang-options">
          <div class="chip" data-action="set-lang" data-lang="fr">Français</div>
          <div class="chip" data-action="set-lang" data-lang="en">English</div>
        </div>
      </div>
    </div>

    <div class="eyebrow" data-i18n="wallpaper"></div>
    <div class="card settings-card">
      <div class="settings-row">
        <div>
          <span class="s-label" data-i18n="app_wallpaper"></span>
          <div class="s-sub" data-i18n="wallpaper_sub"></div>
        </div>
        <img class="wallpaper-thumb" id="wallpaper-thumb" src="assets/wallpaper-default.jpg" alt="">
      </div>
      <div class="settings-row">
        <div class="wallpaper-actions">
          <button class="chip" data-action="change-wallpaper" data-i18n="change"></button>
          <button class="chip" data-action="reset-wallpaper" data-i18n="reset"></button>
        </div>
      </div>
    </div>
    <input type="file" id="wallpaper-input" accept="image/*" style="display:none;">
  </section>

  <!-- ============================================================
       Bottom navigation
       ============================================================ -->
  <nav class="bottom-nav" id="bottom-nav">
    <div class="bottom-nav-inner">
      <button class="nav-btn" data-action="go-zen" aria-label="ZEN" id="nav-zen-btn">
        <span style="font-family:var(--font-display);font-weight:800;font-size:15px;">Z</span>
      </button>
      <button class="nav-btn center" data-action="go-home" aria-label="Accueil">
        <img src="assets/icons/nav-home.png" alt="" style="width:60%;height:60%;object-fit:contain;">
      </button>
      <button class="nav-btn" data-action="go-settings" aria-label="Réglages" id="nav-settings-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </nav>

  <!-- ============================================================
       Feuilles modales
       ============================================================ -->
  <div class="overlay" id="overlay">

    <!-- Ajouter / éditer une note -->
    <div class="sheet" data-sheet="note">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title" id="note-sheet-title" data-i18n="new_note"></div>
        <button class="sheet-close" data-action="close-sheet">✕</button>
      </div>
      <div class="field"><textarea id="note-input" maxlength="500" data-i18n-placeholder="note_placeholder"></textarea></div>
      <div class="sheet-actions">
        <button class="btn danger-ghost" id="note-delete-btn" data-action="delete-note" style="display:none;" data-i18n="delete"></button>
        <button class="btn primary" data-action="save-note" data-i18n="save"></button>
      </div>
    </div>

    <!-- Liste de notes (toutes / idées importantes) -->
    <div class="sheet" data-sheet="notes-list">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title" id="notes-list-title">Toutes les notes</div>
        <button class="sheet-close" data-action="close-sheet">✕</button>
      </div>
      <div id="notes-list-content"></div>
    </div>

    <!-- Modifier le nom d'un menu -->
    <div class="sheet" data-sheet="label-edit">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title" data-i18n="rename_menu"></div>
        <button class="sheet-close" data-action="close-sheet">✕</button>
      </div>
      <div class="field"><input type="text" id="label-input" maxlength="24"></div>
      <div class="sheet-actions">
        <button class="btn primary" data-action="save-label" data-i18n="save"></button>
      </div>
    </div>

    <!-- Nouveau projet -->
    <div class="sheet" data-sheet="project-new">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title" data-i18n="new_project"></div>
        <button class="sheet-close" data-action="close-sheet">✕</button>
      </div>
      <div class="field">
        <label data-i18n="project_name"></label>
        <input type="text" id="project-name-input" maxlength="40" data-i18n-placeholder="project_name_placeholder">
      </div>
      <div class="sheet-actions">
        <button class="btn primary" data-action="save-project" data-i18n="add"></button>
      </div>
    </div>

    <!-- Detail d'un projet -->
    <div class="sheet" data-sheet="project-detail">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title" id="project-detail-title">Projet</div>
        <button class="sheet-close" data-action="close-sheet">✕</button>
      </div>
      <div id="project-items-list"></div>
      <div class="field" style="margin-top:6px;">
        <label data-i18n="add_note_to_project"></label>
        <input type="text" id="project-note-input" maxlength="200" data-i18n-placeholder="note_placeholder">
      </div>
      <div class="sheet-actions">
        <button class="btn ghost" data-action="add-project-photo" data-i18n="add_photo"></button>
        <button class="btn primary" data-action="add-project-note" data-i18n="add"></button>
      </div>
      <button class="btn danger-ghost" data-action="delete-project" style="margin-top:10px;width:100%;" data-i18n="delete_project"></button>
    </div>
    <input type="file" id="project-photo-input" accept="image/*" style="display:none;">

    <!-- Nouvelle citation -->
    <div class="sheet" data-sheet="quote">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title" data-i18n="new_quote"></div>
        <button class="sheet-close" data-action="close-sheet">✕</button>
      </div>
      <div class="field"><textarea id="quote-input" maxlength="240" data-i18n-placeholder="quote_placeholder"></textarea></div>
      <div class="sheet-actions">
        <button class="btn primary" data-action="save-quote" data-i18n="add"></button>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
